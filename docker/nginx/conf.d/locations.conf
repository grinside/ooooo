# Location configuration for Max IT TV Affiliation System
# This file is included in both HTTP and HTTPS server blocks

# Security headers (applied to all responses)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# API endpoints
location /api {
    # Rate limiting
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # Proxy settings
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Error handling
    proxy_intercept_errors on;
    error_page 502 503 504 /50x.html;

    # Disable caching for API responses by default
    proxy_cache_bypass $http_pragma $http_authorization;
    proxy_no_cache $http_pragma $http_authorization;
    add_header X-Cache-Status $upstream_cache_status;

    # CORS headers (if API doesn't set them)
    # add_header Access-Control-Allow-Origin "$http_origin" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Request-ID" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    # add_header Access-Control-Max-Age 3600 always;

    # Handle OPTIONS requests
    # if ($request_method = 'OPTIONS') {
    #     return 204;
    # }
}

# Authentication endpoints (stricter rate limiting)
location /api/v1/auth {
    limit_req zone=auth_limit burst=5 nodelay;
    limit_conn conn_limit 5;

    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# Webhook endpoints (no rate limiting for payment providers)
location /api/v1/webhooks {
    limit_req zone=general_limit burst=50 nodelay;

    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Larger body size for webhooks
    client_max_body_size 5M;
}

# Health check endpoint
location /health {
    access_log off;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# Metrics endpoint (restrict access in production)
location /metrics {
    # Uncomment to restrict to internal IPs only
    # allow 172.28.0.0/16;  # Docker network
    # allow 10.0.0.0/8;      # Private network
    # deny all;

    access_log off;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Uploaded files (with caching)
location /uploads/ {
    alias /usr/share/nginx/html/uploads/;

    # Security: prevent execution of uploaded files
    location ~ \.(php|pl|py|jsp|asp|sh|cgi)$ {
        return 403;
    }

    # Caching for uploaded files
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;

    # CORS for media files
    add_header Access-Control-Allow-Origin "*" always;
}

# Static frontend files
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Caching strategy
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service worker (no caching)
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

# Error pages
location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}

location = /404.html {
    root /usr/share/nginx/html;
    internal;
}

# Deny access to hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to backup and source files
location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
}
